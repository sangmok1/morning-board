<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아침보드</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div id="app">
  <canvas id="backdrop"></canvas>

  <div class="board" id="boardScreen">
    <header class="header">
      <div class="clockrow">
        <span class="clock" id="clock">--:--</span>
        <span class="date" id="date"></span>
      </div>
      <span class="updated" id="updated"></span>
      <button class="gear" id="expandBtn" title="펼치기/접기">⤢</button>
      <button class="gear" id="gearBtn" title="설정">⚙</button>
    </header>

    <section class="card shuttle" id="shuttleCard" hidden>
      <div class="bus-title"><span>🚐&nbsp; 셔틀</span></div>
      <div class="shuttle-list" id="shuttleList"></div>
    </section>

    <section class="card bus" id="busCard">
      <div class="bus-title">
        <span>🚌&nbsp; 버스 도착</span>
        <span class="hint">탭하면 새로고침</span>
      </div>
      <div class="bus-list" id="busList"></div>
    </section>

    <section class="card weather" id="weatherCard"></section>
  </div>

  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings" id="settings"></div>
  </div>
  </div><!-- /#app -->

  <script src="js/pixel.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/board.js"></script>
  <script src="js/backdrop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
